<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>书籍查询系统</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 40px 20px;
        }

        .container {
            max-width: 700px;
            margin: 0 auto;
            background: white;
            border-radius: 16px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            overflow: hidden;
        }

        .header {
            background: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%);
            padding: 30px;
            text-align: center;
        }

        .header h1 {
            color: white;
            font-size: 28px;
            font-weight: 600;
        }

        .header p {
            color: rgba(255, 255, 255, 0.9);
            margin-top: 8px;
            font-size: 14px;
        }

        .content {
            padding: 30px;
        }

        .input-group {
            margin-bottom: 20px;
        }

        .input-group label {
            display: block;
            color: #333;
            font-weight: 500;
            margin-bottom: 10px;
            font-size: 15px;
        }

        .input-group textarea {
            width: 100%;
            padding: 15px;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            font-size: 15px;
            resize: vertical;
            min-height: 100px;
            transition: border-color 0.3s ease;
            font-family: inherit;
        }

        .input-group textarea:focus {
            outline: none;
            border-color: #4facfe;
        }

        .btn {
            width: 100%;
            padding: 15px;
            background: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(79, 172, 254, 0.4);
        }

        .btn:active {
            transform: translateY(0);
        }

        .btn:disabled {
            background: #ccc;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }

        .result-section {
            margin-top: 30px;
            padding-top: 30px;
            border-top: 1px solid #eee;
            display: none;
        }

        .result-section.show {
            display: block;
        }

        .result-header {
            display: flex;
            align-items: center;
            margin-bottom: 15px;
        }

        .result-icon {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-right: 12px;
            font-size: 18px;
        }

        .result-icon.success {
            background: #d4edda;
            color: #155724;
        }

        .result-icon.error {
            background: #f8d7da;
            color: #721c24;
        }

        .result-icon.loading {
            background: #d1ecf1;
            color: #0c5460;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        .result-header h3 {
            color: #333;
            font-size: 16px;
        }

        .result-content {
            background: #f8f9fa;
            border-radius: 10px;
            padding: 20px;
            min-height: 100px;
        }

        .result-content pre {
            white-space: pre-wrap;
            word-wrap: break-word;
            font-size: 14px;
            color: #333;
            font-family: 'Courier New', Courier, monospace;
            line-height: 1.6;
        }

        .result-content .error-message {
            color: #dc3545;
        }

        .loading-text {
            color: #6c757d;
            font-style: italic;
        }

        .footer {
            padding: 20px 30px;
            background: #f8f9fa;
            text-align: center;
            font-size: 13px;
            color: #6c757d;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>📚 书籍查询系统</h1>
            <p>输入您的问题，获取书籍信息</p>
        </div>
        
        <div class="content">
            <div class="input-group">
                <label for="question">您的问题</label>
                <textarea id="question" placeholder="请输入您想查询的问题，例如：&#10;有哪些编程相关的书籍？&#10;《红楼梦》的价格是多少？&#10;查询库存大于1000的书籍"></textarea>
            </div>
            
            <button class="btn" id="submitBtn">发送查询</button>
            
            <div class="result-section" id="resultSection">
                <div class="result-header">
                    <div class="result-icon" id="resultIcon">
                        <span>📋</span>
                    </div>
                    <h3 id="resultTitle">查询结果</h3>
                </div>
                <div class="result-content" id="resultContent">
                    <pre id="resultText"></pre>
                </div>
            </div>
        </div>
        
        <div class="footer">
            数据来源：bookstore 数据库 | 接口地址：http://localhost:5678/webhook/booksearch
        </div>
    </div>

    <script>
        const questionInput = document.getElementById('question');
        const submitBtn = document.getElementById('submitBtn');
        const resultSection = document.getElementById('resultSection');
        const resultIcon = document.getElementById('resultIcon');
        const resultTitle = document.getElementById('resultTitle');
        const resultContent = document.getElementById('resultContent');
        const resultText = document.getElementById('resultText');

        submitBtn.addEventListener('click', async () => {
            const question = questionInput.value.trim();
            
            if (!question) {
                alert('请输入您的问题');
                return;
            }

            submitBtn.disabled = true;
            submitBtn.textContent = '查询中...';
            
            resultSection.classList.remove('show');
            
            resultIcon.className = 'result-icon loading';
            resultIcon.innerHTML = '<span>⏳</span>';
            resultTitle.textContent = '查询中';
            resultText.innerHTML = '<span class="loading-text">正在处理您的请求...</span>';
            resultSection.classList.add('show');

            try {
                console.log('开始发送请求到:', 'http://localhost:5678/webhook/booksearch');
                console.log('请求数据:', { Question: question });
                
                const response = await fetch('http://localhost:5678/webhook/booksearch', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({ Question: question }),
                });
                
                console.log('响应状态:', response.status);
                console.log('响应头:', response.headers);
                
                if (!response.ok) {
                    throw new Error(`HTTP error! status: ${response.status}`);
                }

                // 先获取原始文本
                const text = await response.text();
                console.log('原始响应:', text);
                
                // 尝试解析JSON
                let data;
                try {
                    data = JSON.parse(text);
                } catch (parseError) {
                    console.error('JSON解析失败:', parseError);
                    data = { Answer: text };
                }
                
                console.log('解析后的数据:', data);
                
                resultIcon.className = 'result-icon success';
                resultIcon.innerHTML = '<span>✅</span>';
                resultTitle.textContent = '查询成功';
                
                if (typeof data === 'object' && data.Answer) {
                    resultText.textContent = data.Answer;
                } else if (typeof data === 'object') {
                    resultText.textContent = JSON.stringify(data, null, 2);
                } else {
                    resultText.textContent = data;
                }
                
            } catch (error) {
                resultIcon.className = 'result-icon error';
                resultIcon.innerHTML = '<span>❌</span>';
                resultTitle.textContent = '查询失败';
                let errorMessage = `<span class="error-message">请求失败：${error.message}</span>`;
                errorMessage += `<br><span class="error-message">错误类型：${error.name}</span>`;
                errorMessage += `<br><span class="error-message">完整错误：${error.toString()}</span>`;
                resultText.innerHTML = errorMessage;
            } finally {
                submitBtn.disabled = false;
                submitBtn.textContent = '发送查询';
            }
        });

        questionInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter' && e.ctrlKey) {
                submitBtn.click();
            }
        });
    </script>
</body>
</html>
