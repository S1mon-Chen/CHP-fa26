<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>模型上下文协议 (MCP)：从底层原理到企业级工程实践</title>
    <!-- Tailwind CSS 支撑精细排版 -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500;600&family=Poppins:wght@700;900&family=Noto+Sans+SC:wght@300;400;500;700;900&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            background-color: #f1f5f9;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            overflow: hidden;
        }

        /* 绝对锁定 16:9 物理画幅 (1280x720) */
        .slide-container {
            width: 1280px;
            height: 720px;
            background-color: #ffffff;
            font-family: 'Noto Sans SC', sans-serif;
            display: flex;
            flex-direction: column;
            padding: 30px 75px;
            position: relative;
            overflow: hidden;
            box-shadow: 0 25px 50px -12px rgba(15, 23, 42, 0.15);
            border: 1px solid #e2e8f0;
            flex-shrink: 0;
        }

        /* 统一学术背景网格 */
        .academic-grid {
            background-image: radial-gradient(#cbd5e1 1.2px, transparent 1.2px);
            background-size: 30px 30px;
            opacity: 0.35;
            position: absolute;
            inset: 0;
            pointer-events: none;
        }

        .header {
            position: relative;
            z-index: 10;
            margin-bottom: 12px;
        }

        .slide-title {
            font-size: 38px;
            font-weight: 900;
            color: #0f172a;
            letter-spacing: -1px;
            line-height: 1.1;
        }

        .slide-tag {
            font-family: 'Poppins', sans-serif;
            font-size: 11px;
            font-weight: 700;
            color: #2563eb;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: 4px;
            display: block;
        }

        /* 主内容与拓扑图容器 */
        .content-area {
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            min-height: 0;
            position: relative;
            z-index: 10;
            gap: 12px;
        }

        /* SVG 拓扑图容器 */
        .svg-container {
            background: #f8fafc;
            border: 1px solid #e2e8f0;
            border-radius: 20px;
            padding: 10px;
            height: 380px;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.02);
            position: relative;
        }

        /* 底部结论总结卡片 */
        .footer-summary {
            background: #eff6ff;
            border: 1px solid #bfdbfe;
            border-radius: 14px;
            padding: 12px 24px;
            text-align: center;
        }
    </style>
</head>
<body>

<div id="slide-stage" class="slide-container">
    <div class="academic-grid"></div>
    <div class="absolute inset-0 bg-[radial-gradient(ellipse_at_top_right,_var(--tw-gradient-stops))] from-blue-50/40 via-transparent to-transparent pointer-events-none z-0"></div>

    <!-- 顶部标题与课程元信息 -->
    <header class="header flex justify-between items-start">
        <div>
            <span class="slide-tag">应用系统体系架构-MCP · 课程主讲：陈昊鹏 (chen-hp@sjtu.edu.cn)</span>
            <h2 class="slide-title">模型上下文协议 (MCP)：从底层原理到企业级工程实践</h2>
        </div>
        <div class="text-right shrink-0 ml-4">
            <span class="text-[11px] font-bold text-slate-400 block font-mono">SJTU 空间智能软件研究所</span>
            <span class="text-[10px] text-slate-400 block">上海交通大学 计算机学院</span>
        </div>
    </header>

    <!-- 中间核心架构拓扑图与总结 -->
    <main class="content-area">
        <!-- 原生 SVG 绘制：MCP 核心解耦架构拓扑图 -->
        <div class="svg-container">
            <svg viewBox="0 0 1100 350" width="100%" height="100%">
                <defs>
                    <!-- 标准双向箭头 -->
                    <marker id="arrow-blue" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
                        <path d="M 0 0 L 10 5 L 0 10 z" fill="#3b82f6" />
                    </marker>
                </defs>

                <!-- 左侧：AI 应用宿主 (Hosts) -->
                <g transform="translate(20, 20)">
                    <rect x="0" y="0" width="280" height="290" rx="16" fill="#f0f9ff" stroke="#93c5fd" stroke-width="2" />
                    <text x="140" y="32" font-family="sans-serif" font-size="16" font-weight="900" fill="#1e3a8a" text-anchor="middle">AI 应用宿主 (Hosts)</text>
                    
                    <!-- IDE 子卡片 -->
                    <g transform="translate(20, 50)">
                        <rect x="0" y="0" width="240" height="100" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" />
                        <rect x="15" y="15" width="40" height="35" rx="4" fill="#38bdf8" opacity="0.2" />
                        <text x="35" y="38" font-family="sans-serif" font-size="18" font-weight="bold" fill="#0284c7" text-anchor="middle">&lt;/&gt;</text>
                        <text x="140" y="55" font-family="sans-serif" font-size="16" font-weight="bold" fill="#0f172a" text-anchor="middle">IDE</text>
                    </g>

                    <!-- Chat 子卡片 -->
                    <g transform="translate(20, 165)">
                        <rect x="0" y="0" width="240" height="100" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" />
                        <rect x="15" y="15" width="40" height="35" rx="4" fill="#38bdf8" opacity="0.2" />
                        <text x="35" y="38" font-family="sans-serif" font-size="16" text-anchor="middle">💬</text>
                        <text x="140" y="55" font-family="sans-serif" font-size="16" font-weight="bold" fill="#0f172a" text-anchor="middle">Chat</text>
                    </g>
                </g>

                <!-- 左侧连接总线：标准化互操作性 -->
                <path d="M 310 165 L 420 165" fill="none" stroke="#3b82f6" stroke-width="4" marker-end="url(#arrow-blue)" marker-start="url(#arrow-blue)" />
                <polygon points="365,110 395,135 365,160 335,135" fill="#e0f2fe" stroke="#0284c7" stroke-width="2" />
                <text x="365" y="132" font-family="sans-serif" font-size="13" font-weight="900" fill="#0369a1" text-anchor="middle">标准化</text>
                <text x="365" y="150" font-family="sans-serif" font-size="13" font-weight="900" fill="#0369a1" text-anchor="middle">互操作性</text>

                <!-- 中间：MCP 协议层 (Protocol Layer) -->
                <g transform="translate(430, 20)">
                    <rect x="0" y="0" width="280" height="290" rx="16" fill="#f0fdf4" stroke="#86efac" stroke-width="2" />
                    
                    <g transform="translate(25, 20)">
                        <!-- USB 协议 Icon 示意 -->
                        <path d="M 15 10 L 15 40 M 15 25 L 5 15 M 15 20 L 25 10" fill="none" stroke="#16a34a" stroke-width="3" stroke-linecap="round" />
                        <text x="40" y="30" font-family="sans-serif" font-size="16" font-weight="900" fill="#14532d">MCP 协议层</text>
                    </g>

                    <!-- 三大核心原语 (Resources, Tools, Prompts) -->
                    <!-- 1. 资源 -->
                    <g transform="translate(20, 60)">
                        <rect x="0" y="0" width="240" height="65" rx="10" fill="#ffffff" stroke="#bbf7d0" stroke-width="1.5" />
                        <text x="30" y="38" font-family="sans-serif" font-size="20" text-anchor="middle">📚</text>
                        <text x="130" y="38" font-family="sans-serif" font-size="15" font-weight="bold" fill="#15803d" text-anchor="middle">资源 (Resources)</text>
                    </g>

                    <!-- 2. 工具 -->
                    <g transform="translate(20, 135)">
                        <rect x="0" y="0" width="240" height="65" rx="10" fill="#ffffff" stroke="#bbf7d0" stroke-width="1.5" />
                        <text x="30" y="38" font-family="sans-serif" font-size="20" text-anchor="middle">🧰</text>
                        <text x="130" y="38" font-family="sans-serif" font-size="15" font-weight="bold" fill="#15803d" text-anchor="middle">工具 (Tools)</text>
                    </g>

                    <!-- 3. 提示词 -->
                    <g transform="translate(20, 210)">
                        <rect x="0" y="0" width="240" height="65" rx="10" fill="#ffffff" stroke="#bbf7d0" stroke-width="1.5" />
                        <text x="30" y="38" font-family="sans-serif" font-size="20" text-anchor="middle">💡</text>
                        <text x="130" y="38" font-family="sans-serif" font-size="15" font-weight="bold" fill="#15803d" text-anchor="middle">提示词 (Prompts)</text>
                    </g>
                </g>

                <!-- 右侧连接总线：解耦 -->
                <path d="M 720 165 L 800 165" fill="none" stroke="#3b82f6" stroke-width="4" marker-end="url(#arrow-blue)" marker-start="url(#arrow-blue)" />
                <polygon points="760,120 785,165 760,210 735,165" fill="#e0f2fe" stroke="#0284c7" stroke-width="2" />
                <text x="760" y="170" font-family="sans-serif" font-size="14" font-weight="900" fill="#0369a1" text-anchor="middle">解耦</text>

                <!-- 右侧：数据与工具源 (Servers) -->
                <g transform="translate(800, 20)">
                    <rect x="0" y="0" width="280" height="290" rx="16" fill="#f0f9ff" stroke="#93c5fd" stroke-width="2" />
                    <text x="140" y="32" font-family="sans-serif" font-size="16" font-weight="900" fill="#1e3a8a" text-anchor="middle">数据与工具源 (Servers)</text>

                    <!-- 数据库 -->
                    <g transform="translate(20, 50)">
                        <rect x="0" y="0" width="240" height="65" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" />
                        <text x="35" y="38" font-family="sans-serif" font-size="20" text-anchor="middle">🗄️</text>
                        <text x="130" y="38" font-family="sans-serif" font-size="15" font-weight="bold" fill="#334155" text-anchor="middle">Database</text>
                    </g>

                    <!-- 文件系统 -->
                    <g transform="translate(20, 125)">
                        <rect x="0" y="0" width="240" height="65" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" />
                        <text x="35" y="38" font-family="sans-serif" font-size="20" text-anchor="middle">📁</text>
                        <text x="130" y="38" font-family="sans-serif" font-size="15" font-weight="bold" fill="#334155" text-anchor="middle">File systems</text>
                    </g>

                    <!-- 云端 API -->
                    <g transform="translate(20, 200)">
                        <rect x="0" y="0" width="240" height="65" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" />
                        <text x="35" y="38" font-family="sans-serif" font-size="20" text-anchor="middle">🌐</text>
                        <text x="130" y="38" font-family="sans-serif" font-size="15" font-weight="bold" fill="#334155" text-anchor="middle">Cloud APIs</text>
                    </g>
                </g>
            </svg>
        </div>

        <!-- 底部核心结论横幅 -->
        <div class="footer-summary">
            <h3 class="text-[20px] font-black text-blue-900 leading-snug">
                实现 AI 应用组件化与无缝集成 · 推动大模型集成迈向工程化
            </h3>
        </div>
    </main>

    <!-- 底部导航与快捷键 HUD 悬浮组件 -->
    <div class="flex justify-between items-center mt-2 pt-2 border-t border-slate-200 z-10 relative">
        <span class="text-xs font-bold text-slate-400 code-font">01 / 46 · 封面</span>
        <div class="flex items-center gap-3">
            <span class="text-[11px] text-slate-400">💡 按 <code class="code-font bg-slate-100 px-1 rounded border">→</code> 键或点击按钮切页</span>
            <a href="2.html" class="inline-flex items-center gap-1.5 px-3 py-1 text-xs font-bold text-white bg-blue-600 hover:bg-blue-700 rounded-lg transition-colors shadow-sm">
                下一页 (02)
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M9 18l6-6-6-6"/></svg>
            </a>
        </div>
    </div>
</div>

<script>
    // 自动等比例缩放算法：锁定 16:9 画幅，绝对无滚动条
    function scaleSlide() {
        const stage = document.getElementById('slide-stage');
        const scale = Math.min(window.innerWidth / 1280, window.innerHeight / 720);
        stage.style.transform = `scale(${scale})`;
        stage.style.transformOrigin = 'center center';
    }
    window.addEventListener('resize', scaleSlide);
    window.addEventListener('load', scaleSlide);

    // 快捷键翻页支持
    document.addEventListener('keydown', function(e) {
        if (event.key === "ArrowRight" || event.key === "PageDown") {
            window.location.href = "2.html";
        }
    });
</script>

</body>
</html>
