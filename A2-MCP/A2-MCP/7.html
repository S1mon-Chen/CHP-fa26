<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>传输层与分层模型</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500;600&family=Poppins:wght@700;900&family=Noto+Sans+SC:wght@300;400;500;700;900&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            background-color: #f1f5f9;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            overflow: hidden;
        }

        .slide-container {
            width: 1280px;
            height: 720px;
            background-color: #ffffff;
            font-family: 'Noto Sans SC', sans-serif;
            display: flex;
            flex-direction: column;
            padding: 30px 75px;
            position: relative;
            overflow: hidden;
            box-shadow: 0 25px 50px -12px rgba(15, 23, 42, 0.15);
            border: 1px solid #e2e8f0;
            flex-shrink: 0;
        }

        .academic-grid {
            background-image: radial-gradient(#cbd5e1 1.2px, transparent 1.2px);
            background-size: 30px 30px;
            opacity: 0.35;
            position: absolute;
            inset: 0;
            pointer-events: none;
        }

        .header {
            position: relative;
            z-index: 10;
            margin-bottom: 12px;
        }

        .slide-title {
            font-size: 36px;
            font-weight: 900;
            color: #0f172a;
            letter-spacing: -1px;
            line-height: 1.1;
        }

        .slide-tag {
            font-family: 'Poppins', sans-serif;
            font-size: 11px;
            font-weight: 700;
            color: #2563eb;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: 4px;
            display: block;
        }

        .content-area {
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            min-height: 0;
            position: relative;
            z-index: 10;
            gap: 12px;
        }

        .svg-container {
            background: #f8fafc;
            border: 1px solid #e2e8f0;
            border-radius: 20px;
            padding: 10px;
            height: 380px;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.02);
        }

        .footer-summary {
            background: #e0f2fe;
            border: 1px solid #bae6fd;
            border-radius: 14px;
            padding: 12px 24px;
            text-align: center;
        }
    </style>
</head>
<body>

<div id="slide-stage" class="slide-container">
    <div class="academic-grid"></div>
    <div class="absolute inset-0 bg-[radial-gradient(ellipse_at_top_right,_var(--tw-gradient-stops))] from-blue-50/40 via-transparent to-transparent pointer-events-none z-0"></div>

    <header class="header">
        <span class="slide-tag">07 / 46 · 第三部分：协议分层与传输细节</span>
        <h2 class="slide-title">MCP 连接模式详解</h2>
        <p class="text-sm font-medium text-slate-500 mt-0.5">Host 可同时挂载 N 个独立的 MCP 服务器，由 Host 侧实现统一集成上下文</p>
    </header>

    <main class="content-area">
        <!-- SVG 拓扑：详解 1:N 连接拓扑与 STDIO/SSE 通道 -->
        <div class="svg-container">
            <svg viewBox="0 0 1100 350" width="100%" height="100%">
                <defs>
                    <marker id="arrow-grey" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
                        <path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b" />
                    </marker>
                </defs>

                <!-- 左侧：Host 宿主 -->
                <g transform="translate(20, 40)">
                    <rect x="0" y="0" width="220" height="240" rx="16" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2" />
                    
                    <rect x="70" y="-14" width="80" height="28" rx="14" fill="#0f172a" />
                    <text x="110" y="5" font-family="sans-serif" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle">Host 宿主</text>

                    <!-- IDE -->
                    <g transform="translate(20, 35)">
                        <rect x="0" y="0" width="180" height="70" rx="8" fill="#ffffff" stroke="#e2e8f0" />
                        <text x="30" y="42" font-family="sans-serif" font-size="20">💻</text>
                        <text x="105" y="36" font-family="sans-serif" font-size="13" font-weight="bold" fill="#0f172a" text-anchor="middle">现代集成 IDE</text>
                        <text x="105" y="52" font-family="sans-serif" font-size="11" fill="#94a3b8" text-anchor="middle">(VS Code / Cursor)</text>
                    </g>

                    <!-- Chat -->
                    <g transform="translate(20, 125)">
                        <rect x="0" y="0" width="180" height="70" rx="8" fill="#ffffff" stroke="#e2e8f0" />
                        <text x="30" y="42" font-family="sans-serif" font-size="20">💬</text>
                        <text x="105" y="36" font-family="sans-serif" font-size="13" font-weight="bold" fill="#0f172a" text-anchor="middle">AI Chat 客户端</text>
                        <text x="105" y="52" font-family="sans-serif" font-size="11" fill="#94a3b8" text-anchor="middle">(Claude Desktop)</text>
                    </g>
                </g>

                <!-- 中间：三大专用通道 -->
                <g transform="translate(260, 40)">
                    <!-- 通道 1：SQL -->
                    <g transform="translate(0, 10)">
                        <path d="M 0 25 L 360 25" stroke="#64748b" stroke-width="12" stroke-linecap="round" opacity="0.4" />
                        <path d="M 0 25 L 360 25" stroke="#0284c7" stroke-width="10" stroke-linecap="round" marker-end="url(#arrow-grey)" marker-start="url(#arrow-grey)" />
                        <text x="180" y="16" font-family="sans-serif" font-size="12" font-weight="bold" fill="#0f172a" text-anchor="middle">📁 专用 SQL 数据通道</text>
                        <text x="180" y="40" font-family="sans-serif" font-size="10" font-weight="mono" fill="#0284c7" text-anchor="middle">JSON-RPC 2.0 (STDIO)</text>
                    </g>

                    <!-- 通道 2：消息交换 -->
                    <g transform="translate(0, 95)">
                        <path d="M 0 25 L 360 25" stroke="#64748b" stroke-width="12" stroke-linecap="round" opacity="0.4" />
                        <path d="M 0 25 L 360 25" stroke="#0284c7" stroke-width="10" stroke-linecap="round" marker-end="url(#arrow-grey)" marker-start="url(#arrow-grey)" />
                        <text x="180" y="16" font-family="sans-serif" font-size="12" font-weight="bold" fill="#0f172a" text-anchor="middle">💬 实时消息交换通道</text>
                        <text x="180" y="40" font-family="sans-serif" font-size="10" font-weight="mono" fill="#0284c7" text-anchor="middle">JSON-RPC 2.0 (SSE)</text>
                    </g>

                    <!-- 通道 3：通用文件 -->
                    <g transform="translate(0, 180)">
                        <path d="M 0 25 L 360 25" stroke="#64748b" stroke-width="12" stroke-linecap="round" opacity="0.4" />
                        <path d="M 0 25 L 360 25" stroke="#0284c7" stroke-width="10" stroke-linecap="round" marker-end="url(#arrow-grey)" marker-start="url(#arrow-grey)" />
                        <text x="180" y="16" font-family="sans-serif" font-size="12" font-weight="bold" fill="#0f172a" text-anchor="middle">📄 通用文件及本地资源访问</text>
                        <text x="180" y="40" font-family="sans-serif" font-size="10" font-weight="mono" fill="#0284c7" text-anchor="middle">JSON-RPC 2.0 (STDIO)</text>
                    </g>
                </g>

                <!-- 右侧：三大独立的 Server 进程 -->
                <g transform="translate(640, 20)">
                    <!-- Server 1 -->
                    <g transform="translate(0, 0)">
                        <rect x="0" y="0" width="420" height="80" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" />
                        <rect x="0" y="0" width="6" height="80" rx="3" fill="#0284c7" />
                        <text x="25" y="32" font-family="sans-serif" font-size="14" font-weight="900" fill="#0f172a">🗄️ 独立的 MCP 数据库服务器 (Server 进程)</text>
                        <text x="25" y="55" font-family="sans-serif" font-size="11" fill="#64748b">承载企业级只读/写权限控制，向 AI 暴露结构化 SQL 查询与 Schema 发现能力。</text>
                    </g>

                    <!-- Server 2 -->
                    <g transform="translate(0, 95)">
                        <rect x="0" y="0" width="420" height="80" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" />
                        <rect x="0" y="0" width="6" height="80" rx="3" fill="#2563eb" />
                        <text x="25" y="32" font-family="sans-serif" font-size="14" font-weight="900" fill="#0f172a">📱 独立的 MCP 消息/协同服务器 (Server 进程)</text>
                        <text x="25" y="55" font-family="sans-serif" font-size="11" fill="#64748b">封装诸如 Slack、钉钉或企业邮件等第三方通讯工具，提供副作动动作流执行。</text>
                    </g>

                    <!-- Server 3 -->
                    <g transform="translate(0, 190)">
                        <rect x="0" y="0" width="420" height="80" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" />
                        <rect x="0" y="0" width="6" height="80" rx="3" fill="#10b981" />
                        <text x="25" y="32" font-family="sans-serif" font-size="14" font-weight="900" fill="#0f172a">📂 独立的 MCP 文件及知识服务器 (Server 进程)</text>
                        <text x="25" y="55" font-family="sans-serif" font-size="11" fill="#64748b">实现本地多源文件、知识库等资源的抽象路由，按需动态提供大模型上下文。</text>
                    </g>
                </g>
            </svg>
        </div>

        <!-- 底部深色核心总结横幅 -->
        <div class="footer-banner">
            <h3 class="text-[20px] font-black text-white tracking-wide">
                实现跨进程、跨语言、高度可扩展的软件工程级协议集成 (1:N 混合拓扑模式)
            </h3>
        </div>
    </main>

    <!-- 翻页导航栏 -->
    <div class="flex justify-between items-center mt-2 pt-2 border-t border-slate-200 z-10 relative">
        <a href="6.html" class="inline-flex items-center gap-1.5 px-3 py-1 text-xs font-bold text-slate-600 bg-slate-100 hover:bg-slate-200 rounded-lg transition-colors">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M15 18l-6-6 6-6"/></svg>
            上一页 (06)
        </a>
        <span class="text-xs font-bold text-slate-400 code-font">7 / 46</span>
        <a href="8.html" class="inline-flex items-center gap-1.5 px-3 py-1 text-xs font-bold text-white bg-blue-600 hover:bg-blue-700 rounded-lg transition-colors shadow-sm">
            下一页 (08)
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M9 18l6-6-6-6"/></svg>
        </a>
    </div>
</div>

<script>
    function scaleSlide() {
        const stage = document.getElementById('slide-stage');
        const scale = Math.min(window.innerWidth / 1280, window.innerHeight / 720);
        stage.style.transform = `scale(${scale})`;
        stage.style.transformOrigin = 'center center';
    }
    window.addEventListener('resize', scaleSlide);
    window.addEventListener('load', scaleSlide);

    document.addEventListener('keydown', function(e) {
        if (event.key === "ArrowLeft" || event.key === "PageUp") {
            window.location.href = "6.html";
        } else if (event.key === "ArrowRight" || event.key === "PageDown") {
            window.location.href = "8.html";
        }
    });
</script>

</body>
</html>
