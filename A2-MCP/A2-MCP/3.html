<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>背景：大模型的“最后一公里”痛点</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500;600&family=Poppins:wght@700;900&family=Noto+Sans+SC:wght@300;400;500;700;900&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            background-color: #f1f5f9;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            overflow: hidden;
        }

        .slide-container {
            width: 1280px;
            height: 720px;
            background-color: #ffffff;
            font-family: 'Noto Sans SC', sans-serif;
            display: flex;
            flex-direction: column;
            padding: 30px 75px;
            position: relative;
            overflow: hidden;
            box-shadow: 0 25px 50px -12px rgba(15, 23, 42, 0.15);
            border: 1px solid #e2e8f0;
            flex-shrink: 0;
        }

        .academic-grid {
            background-image: radial-gradient(#cbd5e1 1.2px, transparent 1.2px);
            background-size: 30px 30px;
            opacity: 0.35;
            position: absolute;
            inset: 0;
            pointer-events: none;
        }

        .header {
            position: relative;
            z-index: 10;
            margin-bottom: 12px;
        }

        .slide-title {
            font-size: 36px;
            font-weight: 900;
            color: #0f172a;
            letter-spacing: -1px;
            line-height: 1.1;
        }

        .slide-tag {
            font-family: 'Poppins', sans-serif;
            font-size: 11px;
            font-weight: 700;
            color: #2563eb;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: 4px;
            display: block;
        }

        .content-area {
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            min-height: 0;
            position: relative;
            z-index: 10;
            gap: 12px;
        }

        .svg-container {
            background: #f8fafc;
            border: 1px solid #e2e8f0;
            border-radius: 20px;
            padding: 10px;
            height: 380px;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.02);
        }

        .footer-summary {
            background: #e0f2fe;
            border: 1px solid #bae6fd;
            border-radius: 14px;
            padding: 12px 24px;
            text-align: center;
        }
    </style>
</head>
<body>

<div id="slide-stage" class="slide-container">
    <div class="academic-grid"></div>
    <div class="absolute inset-0 bg-[radial-gradient(ellipse_at_top_right,_var(--tw-gradient-stops))] from-blue-50/40 via-transparent to-transparent pointer-events-none z-0"></div>

    <header class="header">
        <span class="slide-tag">03 / 46 · 第一部分：背景与痛点</span>
        <h2 class="slide-title">背景：大模型的“最后一公里”痛点</h2>
    </header>

    <main class="content-area">
        <!-- SVG 拓扑：展现 LLM 与外部数据源的连接障碍 -->
        <div class="svg-container">
            <svg viewBox="0 0 1100 350" width="100%" height="100%">
                <!-- 左侧：强大但孤立的大语言模型 (LLM) -->
                <g transform="translate(30, 20)">
                    <rect x="0" y="0" width="320" height="290" rx="16" fill="#f0f9ff" stroke="#93c5fd" stroke-width="2" />
                    <text x="160" y="32" font-family="sans-serif" font-size="15" font-weight="900" fill="#1e3a8a" text-anchor="middle">强大但孤立的大型语言模型 (LLM)</text>
                    
                    <g transform="translate(30, 60)">
                        <rect x="0" y="0" width="260" height="200" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" />
                        <!-- 大脑 Icon -->
                        <text x="130" y="80" font-family="sans-serif" font-size="60" text-anchor="middle">🧠</text>
                        <text x="130" y="125" font-family="sans-serif" font-size="16" font-weight="900" fill="#0f172a" text-anchor="middle">大型语言模型 (LLM)</text>
                        
                        <rect x="20" y="145" width="105" height="32" rx="6" fill="#eff6ff" border="1" />
                        <text x="72" y="166" font-family="sans-serif" font-size="11" font-weight="bold" fill="#1d4ed8" text-anchor="middle">强大的推理能力</text>

                        <rect x="135" y="145" width="105" height="32" rx="6" fill="#eff6ff" />
                        <text x="187" y="166" font-family="sans-serif" font-size="11" font-weight="bold" fill="#1d4ed8" text-anchor="middle">通用知识库</text>
                    </g>
                </g>

                <!-- 中间：最后一公里 (连接障碍与锁) -->
                <g transform="translate(380, 20)">
                    <rect x="0" y="0" width="340" height="290" rx="16" fill="#fef2f2" stroke="#fca5a5" stroke-width="1.5" />
                    <text x="170" y="32" font-family="sans-serif" font-size="15" font-weight="900" fill="#991b1b" text-anchor="middle">最后一公里：上下文连接障碍</text>

                    <!-- 断裂红色闪电箭头 -->
                    <path d="M 30 145 L 130 145 M 210 145 L 310 145" fill="none" stroke="#ef4444" stroke-width="4" />
                    <polygon points="130,135 170,145 130,155" fill="#ef4444" />
                    <text x="170" y="130" font-family="sans-serif" font-size="28" text-anchor="middle">🔒</text>

                    <!-- 痛点点列 -->
                    <text x="170" y="80" font-family="sans-serif" font-size="14" font-weight="bold" fill="#7f1d1d" text-anchor="middle">LLM 本地上下文缺失</text>
                    <text x="170" y="195" font-family="sans-serif" font-size="14" font-weight="bold" fill="#7f1d1d" text-anchor="middle">缺乏实时性、私有性</text>
                    <text x="170" y="230" font-family="sans-serif" font-size="14" font-weight="bold" fill="#7f1d1d" text-anchor="middle">Prompt 语境难以注入</text>
                </g>

                <!-- 右侧：孤立的外部数据源 -->
                <g transform="translate(750, 20)">
                    <rect x="0" y="0" width="320" height="290" rx="16" fill="#f0fdf4" stroke="#86efac" stroke-width="2" />
                    <text x="160" y="32" font-family="sans-serif" font-size="15" font-weight="900" fill="#14532d" text-anchor="middle">孤立的外部数据源</text>

                    <!-- 数据库 -->
                    <g transform="translate(30, 55)">
                        <rect x="0" y="0" width="260" height="60" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" />
                        <text x="40" y="38" font-family="sans-serif" font-size="22" text-anchor="middle">🗄️</text>
                        <text x="150" y="36" font-family="sans-serif" font-size="15" font-weight="bold" fill="#334155" text-anchor="middle">Database (SQL)</text>
                    </g>

                    <!-- 文件系统 -->
                    <g transform="translate(30, 125)">
                        <rect x="0" y="0" width="260" height="60" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" />
                        <text x="40" y="38" font-family="sans-serif" font-size="22" text-anchor="middle">📁</text>
                        <text x="150" y="36" font-family="sans-serif" font-size="15" font-weight="bold" fill="#334155" text-anchor="middle">File Systems</text>
                    </g>

                    <!-- 云端 API -->
                    <g transform="translate(30, 195)">
                        <rect x="0" y="0" width="260" height="60" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" />
                        <text x="40" y="38" font-family="sans-serif" font-size="22" text-anchor="middle">🌐</text>
                        <text x="150" y="36" font-family="sans-serif" font-size="15" font-weight="bold" fill="#334155" text-anchor="middle">Cloud APIs</text>
                    </g>
                </g>
            </svg>
        </div>

        <div class="footer-summary">
            <h3 class="text-[20px] font-black text-sky-900">
                实现 AI 从“推理”迈向“行动”的关键一环
            </h3>
        </div>
    </main>

    <!-- 翻页导航栏 -->
    <div class="flex justify-between items-center mt-2 pt-2 border-t border-slate-200 z-10 relative">
        <a href="2.html" class="inline-flex items-center gap-1.5 px-3 py-1 text-xs font-bold text-slate-600 bg-slate-100 hover:bg-slate-200 rounded-lg transition-colors">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M15 18l-6-6 6-6"/></svg>
            上一页 (02)
        </a>
        <span class="text-xs font-bold text-slate-400 code-font">03 / 46</span>
        <a href="4.html" class="inline-flex items-center gap-1.5 px-3 py-1 text-xs font-bold text-white bg-blue-600 hover:bg-blue-700 rounded-lg transition-colors shadow-sm">
            下一页 (04)
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M9 18l6-6-6-6"/></svg>
        </a>
    </div>
</div>

<script>
    function scaleSlide() {
        const stage = document.getElementById('slide-stage');
        const scale = Math.min(window.innerWidth / 1280, window.innerHeight / 720);
        stage.style.transform = `scale(${scale})`;
        stage.style.transformOrigin = 'center center';
    }
    window.addEventListener('resize', scaleSlide);
    window.addEventListener('load', scaleSlide);

    document.addEventListener('keydown', function(e) {
        if (event.key === "ArrowLeft" || event.key === "PageUp") {
            window.location.href = "2.html";
        } else if (event.key === "ArrowRight" || event.key === "PageDown") {
            window.location.href = "4.html";
        }
    });
</script>

</body>
</html>
