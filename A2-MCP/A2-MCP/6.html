<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>核心架构参与者模型</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500;600&family=Poppins:wght@700;900&family=Noto+Sans+SC:wght@300;400;500;700;900&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            background-color: #f1f5f9;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            overflow: hidden;
        }

        .slide-container {
            width: 1280px;
            height: 720px;
            background-color: #ffffff;
            font-family: 'Noto Sans SC', sans-serif;
            display: flex;
            flex-direction: column;
            padding: 30px 75px;
            position: relative;
            overflow: hidden;
            box-shadow: 0 25px 50px -12px rgba(15, 23, 42, 0.15);
            border: 1px solid #e2e8f0;
            flex-shrink: 0;
        }

        .academic-grid {
            background-image: radial-gradient(#cbd5e1 1.2px, transparent 1.2px);
            background-size: 30px 30px;
            opacity: 0.35;
            position: absolute;
            inset: 0;
            pointer-events: none;
        }

        .header {
            position: relative;
            z-index: 10;
            margin-bottom: 12px;
        }

        .slide-title {
            font-size: 36px;
            font-weight: 900;
            color: #0f172a;
            letter-spacing: -1px;
            line-height: 1.1;
        }

        .slide-tag {
            font-family: 'Poppins', sans-serif;
            font-size: 11px;
            font-weight: 700;
            color: #2563eb;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: 4px;
            display: block;
        }

        .content-area {
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            min-height: 0;
            position: relative;
            z-index: 10;
            gap: 12px;
        }

        .svg-container {
            background: #f8fafc;
            border: 1px solid #e2e8f0;
            border-radius: 20px;
            padding: 10px;
            height: 380px;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.02);
        }

        .footer-summary {
            background: #eff6ff;
            border: 1px solid #bfdbfe;
            border-radius: 14px;
            padding: 12px 24px;
            text-align: center;
        }
    </style>
</head>
<body>

<div id="slide-stage" class="slide-container">
    <div class="academic-grid"></div>
    <div class="absolute inset-0 bg-[radial-gradient(ellipse_at_top_right,_var(--tw-gradient-stops))] from-blue-50/40 via-transparent to-transparent pointer-events-none z-0"></div>

    <header class="header">
        <span class="slide-tag">06 / 46 · 第二部分：核心拓扑与参与者</span>
        <h2 class="slide-title">核心架构参与者模型</h2>
    </header>

    <main class="content-area">
        <div class="svg-container">
            <svg viewBox="0 0 1100 350" width="100%" height="100%">
                <defs>
                    <!-- 双向蓝向箭头 -->
                    <marker id="arrow-blue" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
                        <path d="M 0 0 L 10 5 L 0 10 z" fill="#0284c7" />
                    </marker>
                </defs>

                <!-- ① AI 应用宿主 (Host) [x: 20 -> 280] -->
                <g transform="translate(20, 20)">
                    <rect x="0" y="0" width="260" height="290" rx="16" fill="#f0f9ff" stroke="#93c5fd" stroke-width="2" />
                    <text x="130" y="32" font-family="sans-serif" font-size="16" font-weight="900" fill="#1e3a8a" text-anchor="middle">AI 应用宿主 (Host)</text>
                    
                    <text x="25" y="65" font-family="sans-serif" font-size="13" font-weight="bold" fill="#334155">• 用户交互界面</text>
                    <text x="25" y="88" font-family="sans-serif" font-size="13" font-weight="bold" fill="#334155">• 指令发起端</text>

                    <!-- 图标列表卡片 -->
                    <g transform="translate(20, 110)">
                        <rect x="0" y="0" width="220" height="155" rx="10" fill="#ffffff" stroke="#cbd5e1" />
                        
                        <!-- IDE -->
                        <g transform="translate(15, 20)">
                            <rect x="0" y="0" width="40" height="40" rx="8" fill="#e0f2fe" />
                            <text x="20" y="27" font-family="sans-serif" font-size="20" text-anchor="middle">💻</text>
                            <text x="55" y="25" font-family="sans-serif" font-size="13" font-weight="bold" fill="#0f172a">IDE</text>
                            <text x="55" y="40" font-family="sans-serif" font-size="11" font-bold fill="#64748b">(VS Code/Cursor)</text>
                        </g>

                        <!-- Chatbot -->
                        <g transform="translate(15, 80)">
                            <rect x="0" y="0" width="40" height="40" rx="8" fill="#e0f2fe" />
                            <text x="20" y="27" font-family="sans-serif" font-size="20" text-anchor="middle">💬</text>
                            <text x="55" y="25" font-family="sans-serif" font-size="13" font-weight="bold" fill="#0f172a">Chatbot</text>
                            <text x="55" y="40" font-family="sans-serif" font-size="11" font-bold fill="#64748b">(Claude Desktop)</text>
                        </g>
                    </g>
                </g>

                <!-- 【通道 1】Host ➔ Client 总线 [x: 280 -> 420] -->
                <g>
                    <path d="M 280 160 L 420 160" stroke="#0284c7" stroke-width="3" marker-end="url(#arrow-blue)" marker-start="url(#arrow-blue)" />
                    <!-- 顶部说明 -->
                    <rect x="295" y="118" width="110" height="22" rx="4" fill="#ffffff" stroke="#93c5fd" stroke-width="1" />
                    <text x="350" y="133" font-family="sans-serif" font-size="11" font-weight="900" fill="#0369a1" text-anchor="middle">指令与结果交换</text>
                    <!-- 底部说明 -->
                    <rect x="295" y="176" width="110" height="22" rx="4" fill="#ffffff" stroke="#cbd5e1" stroke-width="1" />
                    <text x="350" y="191" font-family="sans-serif" font-size="10" font-weight="bold" fill="#64748b" text-anchor="middle">STDIO/SSE 通信</text>
                </g>

                <!-- ② MCP 客户端 (Client) [x: 420 -> 680] -->
                <g transform="translate(420, 20)">
                    <rect x="0" y="0" width="260" height="290" rx="16" fill="#f0f9ff" stroke="#93c5fd" stroke-width="2" />
                    <text x="130" y="32" font-family="sans-serif" font-size="16" font-weight="900" fill="#1e3a8a" text-anchor="middle">MCP 客户端 (Client)</text>
                    
                    <text x="20" y="65" font-family="sans-serif" font-size="13" font-weight="bold" fill="#334155">• 宿主内部生命周期管理</text>

                    <!-- 桥梁连接示意 -->
                    <g transform="translate(20, 110)">
                        <rect x="0" y="0" width="220" height="155" rx="12" fill="#0284c7" />
                        <text x="110" y="80" font-family="sans-serif" font-size="48" text-anchor="middle">🌉</text>
                        <text x="110" y="125" font-family="sans-serif" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle">内部连接与路由桥梁</text>
                    </g>
                </g>

                <!-- 【通道 2】Client ➔ Server JSON-RPC 协议线 [x: 680 -> 820] -->
                <g>
                    <path d="M 680 160 L 820 160" stroke="#0284c7" stroke-width="3" marker-end="url(#arrow-blue)" marker-start="url(#arrow-blue)" />
                    <!-- 中间 JSON-RPC 2.0 标签 -->
                    <rect x="690" y="118" width="120" height="24" rx="6" fill="#e0f2fe" stroke="#38bdf8" stroke-width="1.2" />
                    <text x="750" y="134" font-family="sans-serif" font-size="11" font-weight="900" fill="#0369a1" text-anchor="middle">JSON-RPC 2.0 协议</text>
                    <!-- 底部状态说明 -->
                    <rect x="695" y="176" width="110" height="22" rx="4" fill="#ffffff" stroke="#cbd5e1" stroke-width="1" />
                    <text x="750" y="191" font-family="sans-serif" font-size="10" font-weight="bold" fill="#64748b" text-anchor="middle">1:1 状态连接</text>
                </g>

                <!-- ③ MCP 服务器 (Server) [x: 820 -> 1080] -->
                <g transform="translate(820, 20)">
                    <rect x="0" y="0" width="260" height="290" rx="16" fill="#f0f9ff" stroke="#93c5fd" stroke-width="2" />
                    <text x="130" y="32" font-family="sans-serif" font-size="16" font-weight="900" fill="#1e3a8a" text-anchor="middle">MCP 服务器 (Server)</text>
                    
                    <text x="25" y="65" font-family="sans-serif" font-size="13" font-weight="bold" fill="#334155">• 独立进程运行</text>
                    <text x="25" y="88" font-family="sans-serif" font-size="13" font-weight="bold" fill="#334155">• 核心能力提供者</text>

                    <!-- 数据与原语组 -->
                    <g transform="translate(20, 110)">
                        <rect x="0" y="0" width="220" height="155" rx="10" fill="#ffffff" stroke="#cbd5e1" />
                        
                        <g transform="translate(20, 20)">
                            <text x="15" y="20" font-family="sans-serif" font-size="20" text-anchor="middle">📁</text>
                            <text x="40" y="18" font-family="sans-serif" font-size="13" font-weight="bold" fill="#0f172a">Resources</text>
                        </g>
                        <g transform="translate(20, 60)">
                            <text x="15" y="20" font-family="sans-serif" font-size="20" text-anchor="middle">🗄️</text>
                            <text x="40" y="18" font-family="sans-serif" font-size="13" font-weight="bold" fill="#0f172a">Database</text>
                        </g>
                        <g transform="translate(20, 100)">
                            <text x="15" y="20" font-family="sans-serif" font-size="20" text-anchor="middle">⚙️</text>
                            <text x="40" y="18" font-family="sans-serif" font-size="13" font-weight="bold" fill="#0f172a">Tools / Prompts</text>
                        </g>
                    </g>
                </g>
            </svg>
        </div>

        <div class="footer-summary">
            <h3 class="text-[20px] font-black text-blue-900">
                建立标准、高效、跨语言的上下文集成架构
            </h3>
        </div>
    </main>

    <!-- 翻页导航栏 -->
    <div class="flex justify-between items-center mt-2 pt-2 border-t border-slate-200 z-10 relative">
        <a href="5.html" class="inline-flex items-center gap-1.5 px-3 py-1 text-xs font-bold text-slate-600 bg-slate-100 hover:bg-slate-200 rounded-lg transition-colors">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M15 18l-6-6 6-6"/></svg>
            上一页 (05)
        </a>
        <span class="text-xs font-bold text-slate-400 code-font">06 / 46</span>
        <a href="7.html" class="inline-flex items-center gap-1.5 px-3 py-1 text-xs font-bold text-white bg-blue-600 hover:bg-blue-700 rounded-lg transition-colors shadow-sm">
            下一页 (07)
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M9 18l6-6-6-6"/></svg>
        </a>
    </div>
</div>

<script>
    function scaleSlide() {
        const stage = document.getElementById('slide-stage');
        const scale = Math.min(window.innerWidth / 1280, window.innerHeight / 720);
        stage.style.transform = `scale(${scale})`;
        stage.style.transformOrigin = 'center center';
    }
    window.addEventListener('resize', scaleSlide);
    window.addEventListener('load', scaleSlide);

    document.addEventListener('keydown', function(e) {
        if (event.key === "ArrowLeft" || event.key === "PageUp") {
            window.location.href = "5.html";
        } else if (event.key === "ArrowRight" || event.key === "PageDown") {
            window.location.href = "7.html";
        }
    });
</script>

</body>
</html>
