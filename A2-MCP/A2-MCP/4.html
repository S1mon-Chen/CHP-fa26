<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>痛点分析：N*M 的集成灾难</title>
    <script src="https://cdn.tailwindcss.com"></script>
    
    <script type="text/javascript" async
    src="https://cdnjs.cloudflare.com/ajax/libs/mathjax/2.7.7/MathJax.js?config=TeX-MML-AM_CHTML">
    </script>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500;600&family=Poppins:wght@700;900&family=Noto+Sans+SC:wght@300;400;500;700;900&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            background-color: #f1f5f9;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            overflow: hidden;
        }

        .slide-container {
            width: 1280px;
            height: 720px;
            background-color: #ffffff;
            font-family: 'Noto Sans SC', sans-serif;
            display: flex;
            flex-direction: column;
            padding: 30px 75px;
            position: relative;
            overflow: hidden;
            box-shadow: 0 25px 50px -12px rgba(15, 23, 42, 0.15);
            border: 1px solid #e2e8f0;
            flex-shrink: 0;
        }

        .academic-grid {
            background-image: radial-gradient(#cbd5e1 1.2px, transparent 1.2px);
            background-size: 30px 30px;
            opacity: 0.35;
            position: absolute;
            inset: 0;
            pointer-events: none;
        }

        .header {
            position: relative;
            z-index: 10;
            margin-bottom: 12px;
        }

        .slide-title {
            font-size: 36px;
            font-weight: 900;
            color: #0f172a;
            letter-spacing: -1px;
            line-height: 1.1;
        }

        .slide-tag {
            font-family: 'Poppins', sans-serif;
            font-size: 11px;
            font-weight: 700;
            color: #2563eb;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: 4px;
            display: block;
        }

        .content-area {
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            min-height: 0;
            position: relative;
            z-index: 10;
            gap: 12px;
        }

        .svg-container {
            background: #f8fafc;
            border: 1px solid #e2e8f0;
            border-radius: 20px;
            padding: 10px;
            height: 360px;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.02);
        }

        /* 底部 4 大弊端卡片网格 */
        .disadvantages-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 16px;
            z-index: 10;
        }

        .disadvantage-card {
            background: #fef2f2;
            border: 1px solid #fecaca;
            border-radius: 12px;
            padding: 10px 14px;
            display: flex;
            align-items: center;
            gap: 10px;
        }
    </style>
</head>
<body>

<div id="slide-stage" class="slide-container">
    <div class="academic-grid"></div>
    <div class="absolute inset-0 bg-[radial-gradient(ellipse_at_top_right,_var(--tw-gradient-stops))] from-blue-50/40 via-transparent to-transparent pointer-events-none z-0"></div>

    <header class="header">
        <span class="slide-tag">04 / 46 · 第一部分：背景与痛点</span>
        <h2 class="slide-title">痛点分析：<script type="math/tex"> N \times M </script> 的集成灾难</h2>
    </header>

    <main class="content-area">
        <!-- SVG 拓扑：展现 N*M 错综复杂的胶水代码交叉乱象 -->
        <div class="svg-container">
            <svg viewBox="0 0 1100 330" width="100%" height="100%">
                <!-- 左侧：N 个 AI 宿主 -->
                <g transform="translate(20, 20)">
                    <rect x="0" y="0" width="240" height="280" rx="14" fill="#f0f9ff" stroke="#93c5fd" stroke-width="1.5" />
                    <text x="120" y="28" font-family="sans-serif" font-size="15" font-weight="900" fill="#1e3a8a" text-anchor="middle">N 个 AI 宿主 (Hosts)</text>

                    <rect x="15" y="45" width="210" height="65" rx="8" fill="#ffffff" stroke="#cbd5e1" />
                    <text x="35" y="83" font-family="sans-serif" font-size="20">💻</text>
                    <text x="125" y="83" font-family="sans-serif" font-size="14" font-weight="bold" fill="#0f172a" text-anchor="middle">VS Code / IDE</text>

                    <rect x="15" y="120" width="210" height="65" rx="8" fill="#ffffff" stroke="#cbd5e1" />
                    <text x="35" y="158" font-family="sans-serif" font-size="20">🛠️</text>
                    <text x="125" y="158" font-family="sans-serif" font-size="14" font-weight="bold" fill="#0f172a" text-anchor="middle">AI IDE</text>

                    <rect x="15" y="195" width="210" height="65" rx="8" fill="#ffffff" stroke="#cbd5e1" />
                    <text x="35" y="233" font-family="sans-serif" font-size="20">🤖</text>
                    <text x="125" y="233" font-family="sans-serif" font-size="14" font-weight="bold" fill="#0f172a" text-anchor="middle">Chatbot</text>
                </g>

                <!-- 中间：错综复杂的蜘蛛网网状胶水连接线 -->
                <g transform="translate(260, 40)">
                    <path d="M 0 35 L 560 35 M 0 35 L 560 110 M 0 35 L 560 185" stroke="#ef4444" stroke-width="1.5" opacity="0.6" />
                    <path d="M 0 110 L 560 35 M 0 110 L 560 110 M 0 110 L 560 185" stroke="#ef4444" stroke-width="1.5" opacity="0.6" />
                    <path d="M 0 185 L 560 35 M 0 185 L 560 110 M 0 185 L 560 185" stroke="#ef4444" stroke-width="1.5" opacity="0.6" />

                    <!-- 爆炸爆炸故障 Icon 示意 -->
                    <text x="280" y="55" font-family="sans-serif" font-size="18" text-anchor="middle">💥</text>
                    <text x="200" y="120" font-family="sans-serif" font-size="18" text-anchor="middle">💥</text>
                    <text x="380" y="160" font-family="sans-serif" font-size="18" text-anchor="middle">💥</text>

                    <rect x="180" y="90" width="200" height="35" rx="18" fill="#fef2f2" stroke="#fca5a5" stroke-width="1.5" />
                    <text x="280" y="112" font-family="sans-serif" font-size="13" font-weight="900" fill="#991b1b" text-anchor="middle">复杂的特定“胶水代码”连接</text>
                </g>

                <!-- 右侧：M 个服务器/数据源 -->
                <g transform="translate(820, 20)">
                    <rect x="0" y="0" width="240" height="280" rx="14" fill="#f0f9ff" stroke="#93c5fd" stroke-width="1.5" />
                    <text x="120" y="28" font-family="sans-serif" font-size="15" font-weight="900" fill="#1e3a8a" text-anchor="middle">M 个服务器/数据源</text>

                    <rect x="15" y="45" width="210" height="65" rx="8" fill="#ffffff" stroke="#cbd5e1" />
                    <text x="35" y="83" font-family="sans-serif" font-size="20">🗄️</text>
                    <text x="125" y="83" font-family="sans-serif" font-size="14" font-weight="bold" fill="#0f172a" text-anchor="middle">Database / Slack</text>

                    <rect x="15" y="120" width="210" height="65" rx="8" fill="#ffffff" stroke="#cbd5e1" />
                    <text x="35" y="158" font-family="sans-serif" font-size="20">📁</text>
                    <text x="125" y="158" font-family="sans-serif" font-size="14" font-weight="bold" fill="#0f172a" text-anchor="middle">Local Files</text>

                    <rect x="15" y="195" width="210" height="65" rx="8" fill="#ffffff" stroke="#cbd5e1" />
                    <text x="35" y="233" font-family="sans-serif" font-size="20">🌐</text>
                    <text x="125" y="233" font-family="sans-serif" font-size="14" font-weight="bold" fill="#0f172a" text-anchor="middle">Cloud APIs</text>
                </g>
            </svg>
        </div>

        <!-- 4 大传统集成弊端 -->
        <div class="disadvantages-grid">
            <div class="disadvantage-card">
                <span class="text-xl">💥</span>
                <div>
                    <h4 class="text-xs font-black text-red-900">集成爆炸</h4>
                    <p class="text-[11px] text-red-700">维护成本随节点暴增</p>
                </div>
            </div>
            <div class="disadvantage-card">
                <span class="text-xl">🔄</span>
                <div>
                    <h4 class="text-xs font-black text-red-900">开发重复</h4>
                    <p class="text-[11px] text-red-700">每个 Host 重新写适配</p>
                </div>
            </div>
            <div class="disadvantage-card">
                <span class="text-xl">🔧</span>
                <div>
                    <h4 class="text-xs font-black text-red-900">难以维护</h4>
                    <p class="text-[11px] text-red-700">接口变动全盘报废</p>
                </div>
            </div>
            <div class="disadvantage-card">
                <span class="text-xl">🔀</span>
                <div>
                    <h4 class="text-xs font-black text-red-900">互操作性差</h4>
                    <p class="text-[11px] text-red-700">缺乏统一标准契约</p>
                </div>
            </div>
        </div>
    </main>

    <!-- 翻页导航栏 -->
    <div class="flex justify-between items-center mt-2 pt-2 border-t border-slate-200 z-10 relative">
        <a href="3.html" class="inline-flex items-center gap-1.5 px-3 py-1 text-xs font-bold text-slate-600 bg-slate-100 hover:bg-slate-200 rounded-lg transition-colors">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M15 18l-6-6 6-6"/></svg>
            上一页 (03)
        </a>
        <span class="text-xs font-bold text-slate-400 code-font">04 / 46</span>
        <a href="5.html" class="inline-flex items-center gap-1.5 px-3 py-1 text-xs font-bold text-white bg-blue-600 hover:bg-blue-700 rounded-lg transition-colors shadow-sm">
            下一页 (05)
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M9 18l6-6-6-6"/></svg>
        </a>
    </div>
</div>

<script>
    function scaleSlide() {
        const stage = document.getElementById('slide-stage');
        const scale = Math.min(window.innerWidth / 1280, window.innerHeight / 720);
        stage.style.transform = `scale(${scale})`;
        stage.style.transformOrigin = 'center center';
    }
    window.addEventListener('resize', scaleSlide);
    window.addEventListener('load', scaleSlide);

    document.addEventListener('keydown', function(e) {
        if (event.key === "ArrowLeft" || event.key === "PageUp") {
            window.location.href = "3.html";
        } else if (event.key === "ArrowRight" || event.key === "PageDown") {
            window.location.href = "5.html";
        }
    });
</script>

</body>
</html>
