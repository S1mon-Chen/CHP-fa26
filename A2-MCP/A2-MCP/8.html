<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>传输层与分层模型</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500;600&family=Poppins:wght@700;900&family=Noto+Sans+SC:wght@300;400;500;700;900&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            background-color: #f1f5f9;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            overflow: hidden;
        }

        .slide-container {
            width: 1280px;
            height: 720px;
            background-color: #ffffff;
            font-family: 'Noto Sans SC', sans-serif;
            display: flex;
            flex-direction: column;
            padding: 30px 75px;
            position: relative;
            overflow: hidden;
            box-shadow: 0 25px 50px -12px rgba(15, 23, 42, 0.15);
            border: 1px solid #e2e8f0;
            flex-shrink: 0;
        }

        .academic-grid {
            background-image: radial-gradient(#cbd5e1 1.2px, transparent 1.2px);
            background-size: 30px 30px;
            opacity: 0.35;
            position: absolute;
            inset: 0;
            pointer-events: none;
        }

        .header {
            position: relative;
            z-index: 10;
            margin-bottom: 12px;
        }

        .slide-title {
            font-size: 36px;
            font-weight: 900;
            color: #0f172a;
            letter-spacing: -1px;
            line-height: 1.1;
        }

        .slide-tag {
            font-family: 'Poppins', sans-serif;
            font-size: 11px;
            font-weight: 700;
            color: #2563eb;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: 4px;
            display: block;
        }

        .content-area {
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            min-height: 0;
            position: relative;
            z-index: 10;
            gap: 12px;
        }

        .svg-container {
            background: #f8fafc;
            border: 1px solid #e2e8f0;
            border-radius: 20px;
            padding: 10px;
            height: 380px;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.02);
        }

        .footer-summary {
            background: #e0f2fe;
            border: 1px solid #bae6fd;
            border-radius: 14px;
            padding: 12px 24px;
            text-align: center;
        }
    </style>
</head>
<body>

<div id="slide-stage" class="slide-container">
    <div class="academic-grid"></div>
    <div class="absolute inset-0 bg-[radial-gradient(ellipse_at_top_right,_var(--tw-gradient-stops))] from-blue-50/40 via-transparent to-transparent pointer-events-none z-0"></div>

    <header class="header">
        <span class="slide-tag">08 / 46 · 第三部分：协议分层与传输细节</span>
        <h2 class="slide-title">传输层与分层模型</h2>
    </header>

    <main class="content-area">
        <div class="svg-container">
            <svg viewBox="0 0 1100 350" width="100%" height="100%">
                <!-- 左侧：OSI 类比参考 -->
                <g transform="translate(20, 20)">
                    <rect x="0" y="0" width="220" height="290" rx="14" fill="#f0f9ff" stroke="#93c5fd" stroke-width="1.5" />
                    <text x="110" y="28" font-family="sans-serif" font-size="15" font-weight="900" fill="#1e3a8a" text-anchor="middle">OSI 类比参考</text>

                    <rect x="15" y="42" width="190" height="28" rx="6" fill="#ffffff" stroke="#cbd5e1" />
                    <text x="110" y="61" font-family="sans-serif" font-size="12" font-weight="bold" fill="#334155" text-anchor="middle">应用层</text>

                    <rect x="15" y="75" width="190" height="28" rx="6" fill="#ffffff" stroke="#cbd5e1" />
                    <text x="110" y="94" font-family="sans-serif" font-size="12" font-weight="bold" fill="#334155" text-anchor="middle">表示层</text>

                    <rect x="15" y="108" width="190" height="28" rx="6" fill="#ffffff" stroke="#cbd5e1" />
                    <text x="110" y="127" font-family="sans-serif" font-size="12" font-weight="bold" fill="#334155" text-anchor="middle">会话层</text>

                    <rect x="15" y="141" width="190" height="28" rx="6" fill="#0284c7" />
                    <text x="110" y="160" font-family="sans-serif" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle">传输层</text>

                    <rect x="15" y="174" width="190" height="28" rx="6" fill="#ffffff" stroke="#cbd5e1" />
                    <text x="110" y="193" font-family="sans-serif" font-size="12" font-weight="bold" fill="#334155" text-anchor="middle">网络层</text>

                    <rect x="15" y="207" width="190" height="28" rx="6" fill="#ffffff" stroke="#cbd5e1" />
                    <text x="110" y="226" font-family="sans-serif" font-size="12" font-weight="bold" fill="#334155" text-anchor="middle">数据链路层</text>

                    <rect x="15" y="240" width="190" height="28" rx="6" fill="#ffffff" stroke="#cbd5e1" />
                    <text x="110" y="259" font-family="sans-serif" font-size="12" font-weight="bold" fill="#334155" text-anchor="middle">物理层</text>
                </g>

                <!-- 右侧：MCP 对应分层模型 -->
                <g transform="translate(270, 20)">
                    <!-- 1. 应用层 -->
                    <g transform="translate(0, 0)">
                        <rect x="0" y="0" width="480" height="60" rx="10" fill="#f0fdf4" stroke="#86efac" stroke-width="1.5" />
                        <text x="60" y="35" font-family="sans-serif" font-size="15" font-weight="900" fill="#14532d">应用层</text>
                        <text x="130" y="35" font-family="sans-serif" font-size="20">📚 🧰 💡</text>

                        <!-- 右侧说明 -->
                        <text x="500" y="22" font-family="sans-serif" font-size="12" font-weight="bold" fill="#334155">• MCP 原语使用</text>
                        <text x="500" y="38" font-family="sans-serif" font-size="12" font-weight="bold" fill="#334155">• 生命周期管理</text>
                        <text x="500" y="54" font-family="sans-serif" font-size="12" font-weight="bold" fill="#334155">• 功能协商</text>
                    </g>

                    <!-- 2. 表示层 -->
                    <g transform="translate(0, 70)">
                        <rect x="0" y="0" width="480" height="60" rx="10" fill="#f0f9ff" stroke="#93c5fd" stroke-width="1.5" />
                        <text x="60" y="35" font-family="sans-serif" font-size="15" font-weight="900" fill="#1e3a8a">表示层</text>
                        <text x="130" y="35" font-family="sans-serif" font-size="12" font-weight="bold" fill="#0369a1">{ JSON } Request / Response</text>

                        <text x="500" y="30" font-family="sans-serif" font-size="12" font-weight="bold" fill="#334155">• 数据格式化</text>
                        <text x="500" y="48" font-family="sans-serif" font-size="12" font-weight="bold" fill="#0284c7">(JSON-RPC 2.0)</text>
                    </g>

                    <!-- 3. 传输层 (STDIO vs HTTP/SSE) -->
                    <g transform="translate(0, 140)">
                        <rect x="0" y="0" width="480" height="75" rx="10" fill="#0284c7" />
                        <text x="60" y="42" font-family="sans-serif" font-size="15" font-weight="900" fill="#ffffff">传输层</text>

                        <!-- 管道指示 -->
                        <rect x="130" y="12" width="320" height="22" rx="4" fill="#0369a1" />
                        <text x="290" y="27" font-family="sans-serif" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle">STDIO 管道</text>

                        <rect x="130" y="40" width="320" height="22" rx="4" fill="#0369a1" />
                        <text x="290" y="55" font-family="sans-serif" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle">HTTP / SSE 双向长连接</text>

                        <!-- 右侧红框提示卡片 -->
                        <g transform="translate(500, 0)">
                            <rect x="0" y="0" width="280" height="75" rx="10" fill="#fef2f2" stroke="#fca5a5" stroke-width="1.5" />
                            <text x="15" y="25" font-family="sans-serif" font-size="12" font-weight="900" fill="#991b1b">STDIO 重点：</text>
                            <text x="15" y="45" font-family="sans-serif" font-size="11" font-weight="bold" fill="#7f1d1d">错误日志至 stderr，以免污染</text>
                            <text x="15" y="62" font-family="sans-serif" font-size="11" font-weight="bold" fill="#7f1d1d">stdout 协议数据流</text>
                        </g>
                    </g>

                    <!-- 4. Data 物理数据 -->
                    <g transform="translate(0, 225)">
                        <rect x="0" y="0" width="480" height="55" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5" />
                        <text x="60" y="32" font-family="sans-serif" font-size="15" font-weight="900" fill="#334155">Data</text>
                        <text x="130" y="32" font-family="sans-serif" font-size="12" font-weight="bold" fill="#64748b">底端物理读写与连接状态</text>

                        <text x="500" y="32" font-family="sans-serif" font-size="13" font-weight="bold" fill="#334155">连接状态管理 🌐 🗄️</text>
                    </g>
                </g>
            </svg>
        </div>

        <div class="footer-summary">
            <h3 class="text-[20px] font-black text-sky-900">
                建立结构化、可靠的 AI 上下文通信架构
            </h3>
        </div>
    </main>

    <!-- 翻页导航栏 -->
    <div class="flex justify-between items-center mt-2 pt-2 border-t border-slate-200 z-10 relative">
        <a href="7.html" class="inline-flex items-center gap-1.5 px-3 py-1 text-xs font-bold text-slate-600 bg-slate-100 hover:bg-slate-200 rounded-lg transition-colors">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M15 18l-6-6 6-6"/></svg>
            上一页 (07)
        </a>
        <span class="text-xs font-bold text-slate-400 code-font">08 / 46</span>
        <a href="9.html" class="inline-flex items-center gap-1.5 px-3 py-1 text-xs font-bold text-white bg-blue-600 hover:bg-blue-700 rounded-lg transition-colors shadow-sm">
            下一页 (09)
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M9 18l6-6-6-6"/></svg>
        </a>
    </div>
</div>

<script>
    function scaleSlide() {
        const stage = document.getElementById('slide-stage');
        const scale = Math.min(window.innerWidth / 1280, window.innerHeight / 720);
        stage.style.transform = `scale(${scale})`;
        stage.style.transformOrigin = 'center center';
    }
    window.addEventListener('resize', scaleSlide);
    window.addEventListener('load', scaleSlide);

    document.addEventListener('keydown', function(e) {
        if (event.key === "ArrowLeft" || event.key === "PageUp") {
            window.location.href = "7.html";
        } else if (event.key === "ArrowRight" || event.key === "PageDown") {
            window.location.href = "9.html";
        }
    });
</script>

</body>
</html>
