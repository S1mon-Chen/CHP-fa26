server.address=127.0.0.1
server.port=${PORT:8084}
spring.application.name=bookstore-assignment4
spring.threads.virtual.enabled=true
spring.main.keep-alive=true
server.error.include-message=never
server.error.include-stacktrace=never

# No signing key or production credentials are stored in source control.
app.jwt.secret=${JWT_SECRET}
app.jwt.issuer=bookstore-assignment4
app.jwt.audience=bookstore-api
app.jwt.ttl-seconds=900
app.auth.username=${BOOKSTORE_USERNAME}
app.auth.password=${BOOKSTORE_PASSWORD}
app.books.delay-ms=200
