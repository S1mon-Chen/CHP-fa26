# Database Configuration
spring.datasource.url=jdbc:mysql://localhost:3306/bookstore?useSSL=false&serverTimezone=UTC
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect

# Server Configuration
server.port=8080

# Spring Security Configuration
spring.security.user.name=admin
spring.security.user.password=admin

# H2 Console (for development)
spring.h2.console.enabled=false
# Assignment 4: shared stateless authentication and Web virtual threads.
spring.config.import=classpath:application-jwt.properties
