# Use with demo,assignment4 for isolated H2 data and the existing demo accounts.
app.orders.async-enabled=true
app.orders.processing-delay-ms=${ORDER_PROCESSING_DELAY_MS:3000}
spring.datasource.url=jdbc:h2:mem:assignment5;MODE=MySQL;DB_CLOSE_DELAY=-1
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:127.0.0.1:9092}
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.acks=all
spring.kafka.producer.properties.enable.idempotence=true
spring.kafka.producer.properties.max.block.ms=3000
spring.kafka.producer.properties.request.timeout.ms=3000
spring.kafka.producer.properties.delivery.timeout.ms=5000
spring.kafka.consumer.group-id=bookstore-orders-v5
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.enable-auto-commit=false
spring.kafka.consumer.max-poll-records=10
spring.kafka.listener.ack-mode=record
spring.kafka.listener.concurrency=3
server.address=127.0.0.1
