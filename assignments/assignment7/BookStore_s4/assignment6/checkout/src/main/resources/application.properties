server.address=127.0.0.1
server.port=18080
spring.application.name=bookstore-checkout
seata.enabled=true
seata.application-id=bookstore-checkout
seata.tx-service-group=bookstore_tx_group
seata.enable-auto-data-source-proxy=true
seata.data-source-proxy-mode=AT
seata.registry.type=file
seata.config.type=file
seata.service.vgroup-mapping.bookstore_tx_group=default
seata.service.grouplist.default=127.0.0.1:18091
seata.client.undo.log-serialization=jackson
seata.client.rm.lock.retry-times=40
seata.client.rm.lock.retry-interval=50
logging.level.org.apache.seata=INFO
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss.SSS} %5p [%thread] %logger{40} - %msg%n
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.jdbc.DataSourceAutoConfiguration
services.inventory-url=http://127.0.0.1:18081
services.orders-url=http://127.0.0.1:18082
spring.cloud.openfeign.client.config.default.connectTimeout=2000
spring.cloud.openfeign.client.config.default.readTimeout=8000
spring.cloud.openfeign.circuitbreaker.enabled=false
demo.failure-enabled=${DEMO_FAILURE_ENABLED:false}
