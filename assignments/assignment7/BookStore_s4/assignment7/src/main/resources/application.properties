server.address=127.0.0.1
server.port=${PORT:18087}
spring.application.name=bookstore-assignment7
spring.datasource.url=jdbc:mysql://127.0.0.1:${MYSQL_PORT:13307}/bookstore_cache?useSSL=false&allowPublicKeyRetrieval=true&characterEncoding=UTF-8&connectTimeout=2000&socketTimeout=3000
spring.datasource.username=bookstore
spring.datasource.password=${MYSQL_PASSWORD:assignment7-local}
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.connection-timeout=3000
spring.jdbc.template.query-timeout=3
spring.data.redis.host=127.0.0.1
spring.data.redis.port=${REDIS_PORT:16379}
spring.data.redis.connect-timeout=1s
spring.data.redis.timeout=1s
book.cache.ttl-seconds=120
book.cache.jitter-seconds=30
book.cache.null-ttl-seconds=30
book.flow.qps=5
demo.enabled=${DEMO_ENABLED:false}
