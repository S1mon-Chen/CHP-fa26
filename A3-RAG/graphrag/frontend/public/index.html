<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GraphRAG vs RAG 对比演示</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <!-- 头部 -->
        <header class="header">
            <div class="logo">
                <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <circle cx="12" cy="12" r="10"/>
                    <path d="M12 2v4M12 18v4M2 12h4M18 12h4"/>
                    <circle cx="12" cy="12" r="4"/>
                </svg>
                <h1>GraphRAG vs RAG 对比演示</h1>
            </div>
            <div class="status-bar">
                <span id="status-indicator" class="status offline"></span>
                <span id="status-text">连接中...</span>
                <span id="graph-stats"></span>
                <span id="rag-stats"></span>
            </div>
        </header>

        <!-- 主内容区 -->
        <div class="main-content compare-mode">
            <!-- 问题输入区 -->
            <div class="query-panel">
                <div class="panel-header">
                    <h2>提问区域</h2>
                </div>
                <div class="input-area">
                    <textarea id="question-input" placeholder="请输入您的问题...（建议问：张三和谷歌公司有什么关系？）"></textarea>
                    <button id="send-btn" class="btn btn-primary btn-large">发送对比查询</button>
                    <div class="button-group">
                        <button id="import-btn" class="btn btn-secondary">导入示例数据</button>
                        <button id="import-file-btn" class="btn btn-secondary">从文件导入</button>
                    </div>
                </div>
                <div class="file-input-area">
                    <input type="file" id="file-input" accept=".txt" style="display: none;">
                    <span id="file-name" class="file-name"></span>
                </div>
            </div>

            <!-- 对比结果区域 -->
            <div class="compare-results">
                <!-- 左侧：普通 RAG -->
                <div class="result-panel rag-panel">
                    <div class="panel-header">
                        <h3><span class="badge rag">普通 RAG</span></h3>
                    </div>
                    <div class="chat-history" id="rag-chat-history">
                        <div class="message system">
                            <div class="message-content">
                                基于文本相似度检索的问答系统
                            </div>
                        </div>
                    </div>
                    <div class="context-panel" id="rag-context">
                        <h4>检索到的上下文：</h4>
                        <div class="context-content" id="rag-context-content"></div>
                    </div>
                </div>

                <!-- 右侧：GraphRAG -->
                <div class="result-panel graphrag-panel">
                    <div class="panel-header">
                        <h3><span class="badge graphrag">GraphRAG</span></h3>
                    </div>
                    <div class="chat-history" id="graphrag-chat-history">
                        <div class="message system">
                            <div class="message-content">
                                基于知识图谱和关系推理的问答系统
                            </div>
                        </div>
                    </div>
                    <div class="context-panel" id="graphrag-context">
                        <h4>检索到的上下文：</h4>
                        <div class="context-content" id="graphrag-context-content"></div>
                    </div>
                </div>
            </div>

            <!-- 知识图谱可视化 -->
            <div class="graph-panel-full">
                <div class="panel-header">
                    <h2>知识图谱</h2>
                </div>
                <div class="graph-container" id="graph-container">
                    <div class="empty-state">
                        <svg width="64" height="64" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1">
                            <path d="M18 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/>
                            <circle cx="9" cy="7" r="4"/>
                            <path d="M22 21v-2a4 4 0 0 0-3-3.87"/>
                            <path d="M16 3.13a4 4 0 0 1 0 7.75"/>
                        </svg>
                        <p>暂无数据</p>
                        <p class="hint">请先导入数据</p>
                    </div>
                </div>
            </div>
        </div>

        <!-- 底部 -->
        <footer class="footer">
            <p>Powered by Neo4j + Ollama + Flask | GraphRAG vs RAG 对比演示</p>
        </footer>
    </div>

    <script src="app.js"></script>
</body>
</html>
