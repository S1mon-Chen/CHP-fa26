<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RAG 教学 PPT - 封面</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;700;900&family=Noto+Sans+SC:wght@300;400;500;700&display=swap" rel="stylesheet">

    <style>
        /* 1. 基础设置 */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: #f8fafc;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }

        /* 2. 幻灯片容器 - 16:9 比例 */
        .slide-container {
            width: 1280px;
            height: 720px;
            background-color: #ffffff;
            font-family: 'Noto Sans SC', sans-serif;
            position: relative;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            justify-content: center;
            padding: 80px 100px;
            box-shadow: 0 20px 50px rgba(15, 23, 42, 0.08);
            border: 1px solid #e2e8f0;
        }

        /* 3. 背景装饰元素 */
        .background-accent {
            position: absolute;
            top: 0;
            right: 0;
            width: 45%;
            height: 100%;
            background: linear-gradient(135deg, rgba(37, 99, 235, 0.02) 0%, rgba(99, 102, 241, 0.05) 100%);
            z-index: 0;
            clip-path: polygon(15% 0%, 100% 0%, 100% 100%, 0% 100%);
        }

        .dot-grid {
            position: absolute;
            top: 40px;
            left: 40px;
            width: 200px;
            height: 200px;
            background-image: radial-gradient(#cbd5e1 1.5px, transparent 1.5px);
            background-size: 20px 20px;
            opacity: 0.4;
            z-index: 0;
        }

        /* 4. 文字内容区域 */
        .content-wrapper {
            position: relative;
            z-index: 1;
            max-width: 680px;
        }

        .category-tag {
            font-family: 'Poppins', sans-serif;
            font-size: 13px;
            font-weight: 700;
            color: #2563eb;
            text-transform: uppercase;
            letter-spacing: 3px;
            margin-bottom: 24px;
            display: block;
        }

        h1 {
            font-size: 50px;
            font-weight: 900;
            color: #0f172a;
            line-height: 1.25;
            margin-bottom: 20px;
            letter-spacing: -1px;
        }

        h1 span {
            background: linear-gradient(to right, #2563eb, #4f46e5);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .subtitle {
            font-size: 24px;
            font-weight: 400;
            color: #475569;
            margin-bottom: 50px;
            letter-spacing: 0.5px;
        }

        .core-box {
            background-color: #f8fafc;
            border-left: 4px solid #2563eb;
            padding: 20px 28px;
            max-width: 600px;
            border-radius: 0 8px 8px 0;
        }

        .core-label {
            font-size: 11px;
            font-weight: 700;
            color: #94a3b8;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: 6px;
            display: block;
        }

        .core-text {
            font-size: 15px;
            color: #334155;
            line-height: 1.6;
        }

        /* 5. 纯净 SVG 架构图区域 */
        .image-container {
            position: absolute;
            right: 80px;
            top: 50%;
            transform: translateY(-50%);
            width: 440px;
            height: 440px;
            z-index: 1;
            display: flex;
            justify-content: center;
            align-items: center;
        }
    </style>
</head>
<body>

<div class="slide-container" id="slide1">
    <!-- 背景装饰 -->
    <div class="background-accent"></div>
    <div class="dot-grid"></div>

    <!-- 主要文字内容 -->
    <div class="content-wrapper">
        <span class="category-tag">Software Engineering / AI Systems</span>
        <h1>从零构建高性能 <span>RAG 系统</span>：<br>架构、代码工程与 Vibe Coding 实践</h1>
        <p class="subtitle">软件工程视角下的企业级大模型应用开发</p>
        
        <div class="core-box">
            <span class="core-label">授课核心亮点</span>
            <p class="core-text">拒绝拼凑 Demo，深入底层源码逻辑，掌握从组件选型、核心编码、性能调优到 AI 辅助开发的全流程。</p>
        </div>
    </div>

    <!-- 右侧干净的 RAG 系统数据流矢量插图 -->
    <div class="image-container">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
            <defs>
                <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
                    <stop offset="0%" stop-color="#3b82f6" />
                    <stop offset="100%" stop-color="#1d4ed8" />
                </linearGradient>
                <linearGradient id="indigoGrad" x1="0%" y1="0%" x2="100%" y2="100%">
                    <stop offset="0%" stop-color="#6366f1" />
                    <stop offset="100%" stop-color="#4f46e5" />
                </linearGradient>
                <filter id="dropShadow" x="-10%" y="-10%" width="120%" height="120%">
                    <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#0f172a" flood-opacity="0.05" />
                </filter>
            </defs>

            <!-- 动态处理流程虚线 -->
            <path d="M 90 140 Q 200 80 310 140" fill="none" stroke="#cbd5e1" stroke-width="2" stroke-dasharray="6,6" />
            <path d="M 90 260 Q 200 320 310 260" fill="none" stroke="#cbd5e1" stroke-width="2" />
            <path d="M 200 120 L 200 280" fill="none" stroke="#cbd5e1" stroke-width="2" />

            <!-- 节点 1：向量数据库 (中间下方) -->
            <g transform="translate(200, 280)" filter="url(#dropShadow)">
                <ellipse cx="0" cy="15" rx="45" ry="16" fill="url(#blueGrad)" />
                <rect x="-45" y="-15" width="90" height="30" fill="url(#blueGrad)" />
                <ellipse cx="0" cy="-15" rx="45" ry="16" fill="#60a5fa" />
                <line x1="-45" y1="-15" x2="-45" y2="15" stroke="#1d4ed8" stroke-width="1" />
                <line x1="45" y1="-15" x2="45" y2="15" stroke="#1d4ed8" stroke-width="1" />
                <ellipse cx="0" cy="0" rx="45" ry="16" fill="none" stroke="#1e40af" stroke-dasharray="3,3" />
                <line x1="-20" y1="-5" x2="20" y2="-5" stroke="#eff6ff" stroke-width="3" stroke-linecap="round" />
                <line x1="-20" y1="5" x2="10" y2="5" stroke="#eff6ff" stroke-width="3" stroke-linecap="round" />
                <text x="0" y="48" font-family="'Noto Sans SC', sans-serif" font-size="12" font-weight="700" fill="#1e3a8a" text-anchor="middle">向量数据库</text>
            </g>

            <!-- 节点 2：非结构化知识源 (左侧) -->
            <g transform="translate(90, 140)" filter="url(#dropShadow)">
                <rect x="-25" y="-35" width="50" height="70" rx="5" fill="#ffffff" stroke="#64748b" stroke-width="2" />
                <path d="M 10 -35 L 25 -20 L 10 -20 Z" fill="#e2e8f0" stroke="#64748b" stroke-width="2" stroke-linejoin="round" />
                <line x1="-12" y1="-15" x2="12" y2="-15" stroke="#cbd5e1" stroke-width="2.5" stroke-linecap="round" />
                <line x1="-12" y1="-3" x2="12" y2="-3" stroke="#cbd5e1" stroke-width="2.5" stroke-linecap="round" />
                <line x1="-12" y1="9" x2="0" y2="9" stroke="#cbd5e1" stroke-width="2.5" stroke-linecap="round" />
                <text x="0" y="55" font-family="'Noto Sans SC', sans-serif" font-size="12" font-weight="700" fill="#475569" text-anchor="middle">非结构化知识</text>
            </g>

            <!-- 节点 3：大语言模型 (右侧) -->
            <g transform="translate(310, 140)" filter="url(#dropShadow)">
                <circle cx="0" cy="0" r="35" fill="url(#indigoGrad)" />
                <path d="M -8 -8 Q 0 -8 0 -16 Q 0 -8 8 -8 Q 0 -8 0 0 Q 0 -8 -8 -8 Z" fill="#ffffff" />
                <path d="M 4 10 Q 8 10 8 6 Q 8 10 12 10 Q 8 10 8 14 Q 8 10 4 10 Z" fill="#c7d2fe" />
                <text x="0" y="55" font-family="'Noto Sans SC', sans-serif" font-size="12" font-weight="700" fill="#312e81" text-anchor="middle">大语言模型</text>
            </g>

            <!-- 流程连接器标签 -->
            <g transform="translate(130, 225)">
                <rect x="-35" y="-10" width="70" height="20" rx="10" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1" />
                <text x="0" y="3" font-family="'Noto Sans SC', sans-serif" font-size="9" font-weight="700" fill="#2563eb" text-anchor="middle">Embedding</text>
            </g>
            <g transform="translate(270, 225)">
                <rect x="-35" y="-10" width="70" height="20" rx="10" fill="#f5f3ff" stroke="#ddd6fe" stroke-width="1" />
                <text x="0" y="3" font-family="'Noto Sans SC', sans-serif" font-size="9" font-weight="700" fill="#6366f1" text-anchor="middle">Retrieval</text>
            </g>
            <g transform="translate(200, 100)">
                <rect x="-35" y="-10" width="70" height="20" rx="10" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1" />
                <text x="0" y="3" font-family="'Noto Sans SC', sans-serif" font-size="9" font-weight="700" fill="#16a34a" text-anchor="middle">Generation</text>
            </g>
        </svg>
    </div>
</div>

<script>
    // 键盘左右方向键快捷翻页
    document.addEventListener('keydown', function(event) {
        if (event.key === "ArrowRight") {
            window.location.href = "2.html";
        }
    });
</script>

</body>
</html>
