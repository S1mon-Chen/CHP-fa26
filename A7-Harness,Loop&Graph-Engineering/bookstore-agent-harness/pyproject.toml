[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bookstore-agent-harness"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = ["pytest==8.3.5", "fastapi==0.115.12", "uvicorn==0.34.2", "langgraph==1.2.14", "langgraph-checkpoint==4.2.0", "langgraph-checkpoint-sqlite==3.1.1", "langchain-core==1.6.9"]

[project.optional-dependencies]
test = ["httpx==0.28.1"]

[project.scripts]
bookstore-harness = "harness.cli:main"
bookstore-classroom = "harness.web:main"

[tool.setuptools]
packages = ["harness"]

[tool.pytest.ini_options]
testpaths = ["tests"]
