[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
[project]
name = "course-retrieval-agent"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = ["pydantic==2.14.1", "fastapi==0.115.12", "uvicorn==0.34.2"]
[project.optional-dependencies]
test = ["pytest==8.3.5", "httpx==0.28.1"]
[project.scripts]
course-retrieval = "app.cli:main"
course-classroom = "app.web:main"
[tool.setuptools]
packages = ["app"]
[tool.pytest.ini_options]
testpaths = ["tests"]
