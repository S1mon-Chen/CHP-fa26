# Database Configuration
spring.datasource.url=jdbc:mysql://localhost:3306/bookstore_s4?useSSL=false&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=12345678
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect

# Server Configuration
server.port=8080

# Spring Security Configuration
spring.security.user.name=admin
spring.security.user.password=admin

# H2 Console (for development)
spring.h2.console.enabled=false
# LLM Function Calling Configuration (DeepSeek, OpenAI-compatible API)
# API Key is read from the LLM_API_KEY environment variable
llm.base-url=https://api.deepseek.com
llm.model=deepseek-flash
llm.timeout-seconds=60
# Simulated competitor price API: timeout, and the delay used to trigger it (ISBNs starting with 999)
bookstore.competitor.timeout-ms=2000
bookstore.competitor.slow-delay-ms=3000
